<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Histórico — Agenda de Compras</title>
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <button class="topbar__burger" id="nav-burger" type="button" aria-label="Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <span class="topbar__brand">
          <span class="topbar__logo" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg>
          </span>
          Agenda de Compras
        </span>
        <nav class="topbar__nav" id="nav-links">
          <a class="topbar__link" href="index.html">Nova solicitação</a>
          <a class="topbar__link" href="dashboard.html">Compras</a>
          <a class="topbar__link topbar__link--active" href="history.html">Histórico</a>
        </nav>
        <div class="topbar__user-menu" id="user-menu"></div>
      </div>
    </header>

    <main class="page page--wide">
      <div class="page__header">
        <h1 class="page__title">Histórico</h1>
        <p class="page__subtitle">Materiais já marcados como comprados.</p>
      </div>

      <div id="config-banner"></div>

      <div class="toolbar">
        <div class="controls">
          <div class="search">
            <span class="search__icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            </span>
            <input class="input" type="search" id="history-search" placeholder="Buscar no histórico…" aria-label="Buscar no histórico" />
          </div>

          <div class="chips" id="period-chips" role="group" aria-label="Período">
            <button class="chip" data-period="hoje" type="button">Hoje</button>
            <button class="chip" data-period="7" type="button">7 dias</button>
            <button class="chip chip--active" data-period="30" type="button">30 dias</button>
            <button class="chip" data-period="todos" type="button">Todos</button>
          </div>

          <span class="spacer"></span>

          <span class="board-toolbar__status" id="history-status" style="font-size:14px;color:var(--text-3)"></span>

          <button class="icon-btn" id="refresh-btn" type="button" aria-label="Atualizar" title="Atualizar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>
          </button>
        </div>
      </div>

      <div id="history-list"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="ui.js"></script>
    <script src="auth.js"></script>
    <script src="app.js"></script>
    <script src="history.js"></script>
  </body>
</html>
