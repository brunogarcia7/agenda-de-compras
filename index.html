<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Nova solicitação — Agenda de Compras</title>
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <button class="topbar__burger" id="nav-burger" type="button" aria-label="Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <span class="topbar__brand">
          <span class="topbar__logo" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg>
          </span>
          Agenda de Compras
        </span>
        <nav class="topbar__nav" id="nav-links">
          <a class="topbar__link topbar__link--active" href="index.html">Nova solicitação</a>
          <a class="topbar__link" href="dashboard.html">Compras</a>
          <a class="topbar__link" href="history.html">Histórico</a>
        </nav>
        <a class="topbar__gear" href="config.html" aria-label="Configurações" title="Configurações">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        </a>
        <div class="topbar__user-menu" id="user-menu"></div>
      </div>
    </header>

    <main class="page">
      <div class="page__header page__header--center">
        <h1 class="page__title page__title--hero">O que precisamos comprar?</h1>
        <p class="page__subtitle">
          Digite normalmente. A IA organiza os materiais para você.
        </p>
      </div>

      <div id="config-banner"></div>

      <section class="composer">
        <form id="requisition-form" novalidate>
          <!-- The material list is the composer: large, calm, front and center. -->
          <div class="composer__field">
            <textarea
              class="composer__input"
              id="materiais"
              name="materiais"
              placeholder="Ex.: 20 sacos de cimento CP II, 100 m de cabo 2,5 mm vermelho, 10 pares de luva de raspa, 5 joelhos de 50 mm"
              rows="6"
              required
            ></textarea>
          </div>

          <!-- Secondary context, kept light and inline. -->
          <div class="composer__row">
            <label class="composer__inline">
              <span class="composer__inline-label">Obra</span>
              <select class="select input--inline" id="obra" name="obra" required>
                <option value="">Carregando obras…</option>
              </select>
            </label>
          </div>

          <div class="composer__urgency">
            <span class="composer__inline-label">Urgência</span>
            <div class="segmented">
              <label class="segmented__option">
                <input type="radio" name="urgencia" value="Urgente" />
                <span class="segmented__label"><span class="segmented__dot segmented__dot--urgente"></span>Urgente</span>
              </label>
              <label class="segmented__option">
                <input type="radio" name="urgencia" value="Prazo Normal" checked />
                <span class="segmented__label"><span class="segmented__dot segmented__dot--normal"></span>Prazo Normal</span>
              </label>
              <label class="segmented__option">
                <input type="radio" name="urgencia" value="Programado" />
                <span class="segmented__label"><span class="segmented__dot segmented__dot--programado"></span>Programado</span>
              </label>
            </div>
          </div>

          <div class="composer__actions">
            <button class="btn btn--primary" type="submit" id="submit-btn">
              <span class="btn__ai" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9L12 3Z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15Z"/></svg>
              </span>
              <span id="submit-label">Organizar pedido</span>
            </button>
            <a class="btn btn--secondary" href="dashboard.html">Ver compras</a>
          </div>
        </form>

        <div class="review" id="review"></div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="ui.js"></script>
    <script src="auth.js"></script>
    <script src="app.js"></script>
  </body>
</html>
